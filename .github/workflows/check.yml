name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax
        run: |
          for f in $(git ls-files); do
            if [ -f "$f" ] && [ ! -L "$f" ] && head -1 "$f" | grep -q '^#!/bin/sh'; then sh -n "$f"; fi
          done
      - name: Python syntax
        run: |
          for f in $(git ls-files); do
            if [ -f "$f" ] && [ ! -L "$f" ] && head -1 "$f" | grep -q python3; then python3 -m py_compile "$f"; fi
          done
      # Owner-shell operations. Lane shims deliberately block init, migrate and remove.
      - name: Project setup, migration preview, migration and uninstall (disposable HOME)
        run: python3 .github/per-project.py
      - name: Project job boundaries
        run: python3 .github/project-jobs.py
      - name: Questions ledger (ids, answer, drop, concurrent adds)
        run: python3 .github/questions.py
      - name: Test slot, merge-pr UNKNOWN retry, closed lanes' containers
        run: python3 .github/machine-load.py
      - name: Guard shim cases
        run: sh shims/check.sh
      - name: Merge evidence (head pairing, stale head, HIGH finding, template lines, missing file)
        run: |
          T=$(mktemp -d); A=aaaaaaa1111; B=bbbbbbb2222
          ev() { python3 bin/merge-evidence "$T" x "$1" >/dev/null 2>&1; }
          printf 'VERDICT: SHIP\nHEAD: %s\n' $B > $T/x.review.md
          printf 'SECURITY: CLEAN\nHEAD: %s\n' $B > $T/x.security.md
          printf 'VERDICT: PASS\nHEAD: %s\nPERF: OK\nHEAD: %s\n' $A $B > $T/x.verify.md
          if ev $B; then echo "PASS on A counted for B"; exit 1; fi
          printf 'VERDICT: PASS\nHEAD: %s\nPERF: OK\nHEAD: %s\n' $B $B > $T/x.verify.md
          ev $B || { echo "good evidence refused"; exit 1; }
          if ev $A; then echo "stale head accepted"; exit 1; fi
          printf 'SECURITY: FINDINGS (1), highest: HIGH\nHEAD: %s\n' $B > $T/x.security.md
          if ev $B; then echo "HIGH finding accepted"; exit 1; fi
          for bad in 'SECURITY: CLEAN or FINDINGS' 'SECURITY: FINDINGS (n), highest: LOW|MEDIUM|HIGH'; do
            printf '%s\nHEAD: %s\n' "$bad" $B > $T/x.security.md
            if ev $B; then echo "template accepted: $bad"; exit 1; fi
          done
          printf 'SECURITY: FINDINGS (2), highest: MEDIUM\nHEAD: %s\n' $B > $T/x.security.md
          ev $B || { echo "MEDIUM finding refused"; exit 1; }
          printf 'VERDICT: PASS | NEEDS_WORK\nHEAD: %s\nPERF: OK\nHEAD: %s\n' $B $B > $T/x.verify.md
          if ev $B; then echo "verify template accepted"; exit 1; fi
          printf 'VERDICT: PASS\nHEAD: %s\nPERF: OK | REGRESSION | RISK\nHEAD: %s\n' $B $B > $T/x.verify.md
          if ev $B; then echo "perf template accepted"; exit 1; fi
          printf 'VERDICT: PASS\nHEAD: %s\nPERF: OK\nHEAD: %s\n' $B $B > $T/x.verify.md
          printf 'VERDICT: SHIP | NEEDS_WORK | MAJOR_RETHINK\nHEAD: %s\n' $B > $T/x.review.md
          if ev $B; then echo "review template accepted"; exit 1; fi
          rm $T/x.security.md
          if ev $B; then echo "missing file accepted"; exit 1; fi
      - name: Checker docs name each verdict alone (no "PASS | NEEDS_WORK" line to copy)
        run: |
          if grep -rnE '(VERDICT|PERF|SECURITY|highest): ?[A-Z_]+ ?\|' agents skills bin; then exit 1; fi
      - name: Risk tiers
        run: |
          python3 - <<'PY'
          import importlib.machinery, importlib.util
          l = importlib.machinery.SourceFileLoader("mt", "bin/merge-tier")
          m = importlib.util.module_from_spec(importlib.util.spec_from_loader("mt", l)); l.exec_module(m)
          F = lambda p, a=5, c="MODIFIED": {"path": p, "additions": a, "deletions": 0, "changeType": c}
          cases = [([F("README.md", 20)], "low"), ([F("docs/a.md"), F("tests/test_x.py")], "low"),
                   ([F("SECURITY.md")], "medium"), ([F("src/ui/Button.tsx")], "medium"), ([F("README.md", 150)], "medium"),
                   ([F("src/ui/Block.tsx")], "medium"), ([F("src/auth/login.ts")], "high"), ([F("package.json")], "high"),
                   ([F("yarn.lock")], "high"), ([F(".github/workflows/ci.yml")], "high"), ([F("db/migrations/1.sql")], "high"),
                   ([F("docs/a.md", 1, "RENAMED")], "high"), ([F("AGENTS.md")], "high"), ([], "medium"),
                   ([F("bin/merge-pr")], "high"), ([F("shims/guard")], "high"), ([F("git-hooks/pre-push")], "high"),
                   ([F("install.sh")], "high"), ([F(".mcp.json")], "high"), ([F("app/.claude/settings.json")], "high"),
                   ([F("Makefile")], "high"), ([F("agents/lead.md")], "high"), ([F("routing.md")], "high"),
                   ([F("tests/conftest.py")], "medium"), ([F("src/hooks/useCart.ts")], "medium"),
                   ([F("config/codex-rules/default.rules")], "high"), ([F("config/omp-guard/guard.ts")], "high"),
                   ([F("config/omp-lane/x.json")], "high"), ([F("config/opencode/agents/lane.md")], "high"),
                   ([F("bin/lane")], "high"), ([F(".claude-plugin/plugin.json")], "high"),
                   ([F("AGENTS.override.md")], "high"), ([F("CLAUDE.local.md")], "high"), ([F("docs/agents.md")], "high"),
                   ([F("pkg/Claude.md")], "high"), ([F("sub/dir/AGENTS.MD")], "high"), ([F("docs/agents-guide.md")], "low"),
                   ([F("config/memory-review.prompt.md")], "high"), ([F("config/history-candidates.prompt.md")], "high"),
                   ([F("config/monthly-card.md")], "high"), ([F("Agent.md")], "high"), ([F("app/AGENT.md")], "high"),
                   ([F(".opencode/agent/review.md")], "high"), ([F("web/.opencode/agent/lane.md")], "high"),
                   ([F("config/notes.md")], "low")]
          bad = [(f, w, m.tier_of(f, {})) for f, w in cases if m.tier_of(f, {})[0] != w]
          assert not bad, bad
          assert m.tier_of([F("src/app.py")], {"high_paths": ["src/app.py"]})[0] == "high"
          PY
      - name: merge-pr gate (lane refused, a new code per ask for exactly its PRs, bound to the base, fetched settings, crash-safe lock, night, worktree at the merged head, file list)
        run: python3 .github/merge-gate.py
      - name: deja scope (this project's sessions only, checked with deja's own match rule)
        run: |
          H=$(mktemp -d)
          export XDG_CONFIG_HOME="$H/.config" GIT_CONFIG_GLOBAL="$H/.gitconfig" GIT_CONFIG_NOSYSTEM=1
          R=$H/Work/Shop; mkdir -p $R/shop-api/.git $R/shop-wt && touch $R/.lonca.toml
          f=$(HOME="$H" bin/deja-scope "$R") && test -f "${f%.json}.root"
          printf '%s\tin\n' Work/Shop shop-wt/wt-a shop-api/src Shop-shop-api/fix-x Shop/notes > $H/cases
          printf '%s\tout\n' Acme/billing me/Work Work/Shopping Work/Sho Work/Shop2 shop-wtx/a Shop-shop-apix/a apps/backend tmp Work Shopper/x -x/y Shop-x/y Shop,x/y Shop.x/y shop-wt-x/a Work-/Shop > $H/cases.out
          cat $H/cases.out >> $H/cases && go run .github/deja-match/main.go "$f" < $H/cases
          ! grep -q -e Acme -e billing "$f"   # other projects' names appear nowhere
          echo "{\"cwd\": \"$R\"}" | HOME="$H" bin/deja-scope --session | grep -q "not limited"
          grep -q DEJA_POLICY_FILE "$R/.claude/settings.local.json"
      - name: Night mode needs the code
        run: |
          H=$(mktemp -d)
          export XDG_CONFIG_HOME="$H/.config" GIT_CONFIG_GLOBAL="$H/.gitconfig"
          out=$(HOME=$H sh bin/night-on --request demo 23:59)
          c=$(printf '%s' "$out" | sed -n 's/.*start \([a-z0-9]\{3\}\) .*/\1/p')
          if HOME=$H sh bin/night-on --code zzz demo; then echo "wrong code accepted"; exit 1; fi
          if HOME=$H LONCA_LANE=x sh bin/night-on --code "$c" demo; then echo "a lane started night mode"; exit 1; fi
          HOME=$H sh bin/night-on --code "$c" demo
          grep -q '"max_merges": "unlimited"' "$H/.cache/ai-runs/night/demo.json"
          HOME=$H sh bin/night-on --off demo && test ! -e "$H/.cache/ai-runs/night/demo.json"
      - name: AI-trace check (default and strict)
        run: |
          checker="$PWD/bin/ai-trace-check"
          fixture=$(mktemp -d)
          cd "$fixture"
          export HOME="$fixture" XDG_CONFIG_HOME="$fixture/.config" GIT_CONFIG_GLOBAL="$fixture/.gitconfig" GIT_CONFIG_NOSYSTEM=1
          echo "add anthropic client" | "$checker"
          ! printf 'x\n\nCo-Authored-By: Claude <noreply@anthropic.com>\n' | "$checker"
          ! echo "add anthropic client" | GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=lonca.strictTraces GIT_CONFIG_VALUE_0=true "$checker"
      - name: Install and uninstall in an empty home
        run: |
          H=$(mktemp -d)
          export HOME="$H" XDG_CONFIG_HOME="$H/.config" GIT_CONFIG_GLOBAL="$H/.gitconfig" GIT_CONFIG_NOSYSTEM=1
          # The installer supplies a command-local identity for the memory template.
          mkdir -p "$H/bin" && for t in claude gh deja; do printf '#!/bin/sh\nexit 0\n' > "$H/bin/$t"; chmod +x "$H/bin/$t"; done
          printf '#!/bin/sh\necho Linux\n' > "$H/bin/uname"
          printf '#!/bin/sh\necho "$*" >> "$HOME/systemctl.calls"\n' > "$H/bin/systemctl"
          chmod +x "$H/bin/uname" "$H/bin/systemctl"
          install_fixture() {
            env -i HOME="$H" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" GIT_CONFIG_GLOBAL="$GIT_CONFIG_GLOBAL" \
              GIT_CONFIG_NOSYSTEM=1 PATH="$H/bin:/usr/bin:/bin" sh ./install.sh "$@"
          }
          install_fixture --yes
          test -L "$H/.local/bin/lane" && test ! -e "$H/.claude" && test ! -e "$H/.codex"
          test ! -e "$H/.config/systemd/user"
          test ! -e "$GIT_CONFIG_GLOBAL" && test ! -e "$XDG_CONFIG_HOME/git/config"
          install_fixture --yes --timers
          for job in ai-memory-commit deja-index; do
            test -L "$H/.config/systemd/user/$job.timer"
            grep -Fx -- "--user enable --now $job.timer" "$H/systemctl.calls"
          done
          install_fixture --uninstall
          test ! -e "$H/.local/bin/lane"
